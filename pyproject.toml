[project]
name = "cds-cli"
version = "0.1.0"
description = "命令行工具：提交、查询并下载 Copernicus CDS 任务"
readme = "README.md"
authors = [
    { name = "Dongdong Kong", email = "kongdd@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = [
    "aria2>=0.0.1b0 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "cdsapi>=0.7.7",
]
keywords = ["cds", "copernicus", "era5", "climate", "download"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.scripts]
cds = "cds_cli:main"

[project.urls]
Homepage = "https://github.com/kongdd/cds-cli"
Repository = "https://github.com/kongdd/cds-cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cds_cli"]
